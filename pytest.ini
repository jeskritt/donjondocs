[pytest]
asyncio_mode = auto
testpaths = tests
norecursedirs = e2e .nox .git __pycache__
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Silence third-party DeprecationWarnings we can't fix from this codebase.
# Filter by the warning message so the rule survives the warning being
# raised from different modules (pytest-asyncio re-exports / asyncio
# `_deprecated` helper). Drop these as the upstream packages release
# Python 3.14 fixes.
#   - pytest-asyncio + asyncio: asyncio.{get,set}_event_loop_policy
#   - slowapi:                  asyncio.iscoroutinefunction
filterwarnings =
    ignore:'asyncio\.get_event_loop_policy' is deprecated:DeprecationWarning
    ignore:'asyncio\.set_event_loop_policy' is deprecated:DeprecationWarning
    ignore:'asyncio\.iscoroutinefunction' is deprecated:DeprecationWarning
